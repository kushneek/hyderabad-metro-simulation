services:
  - type: web
    name: hmrl-metro-simulation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: METRO_TIMEZONE
        value: Asia/Kolkata
      - key: ADMIN_TOKEN
        generateValue: true
